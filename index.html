<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#232327">
  <title>THR10 Editor</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/protocol.js">
  <link rel="modulepreload" href="js/midi.js">
  <link rel="modulepreload" href="js/panel.js">
  <link rel="modulepreload" href="js/library.js">
</head>
<body class="offline">
  <main class="chassis">
    <aside class="library">
      <h2 class="lib-title">Library</h2>
      <ol id="lib-list"></ol>
      <div class="lib-actions">
        <label class="file-btn">Import<input id="lib-import" type="file" accept=".YDL,.ydl"></label>
        <button id="btn-lib-export" title="Download the library as a .YDL file">Export</button>
      </div>
    </aside>

    <div class="main-col">
    <section class="amp-face">
      <div class="face-top">
        <div class="brand">THR10 <span>Editor</span> <span id="dirty-dot" title="Edited since the last sync with the amp" hidden>●</span></div>
        <div class="btn-group">
          <button id="btn-dump" title="Ask the amp for its current settings" disabled>Read Amp</button>
          <button id="btn-console" title="Open the SysEx console — traffic is logged only while it is open">Console</button>
        </div>
        <label class="push-toggle" title="Amp panel LEDs on/off">
          <input id="chk-led" type="checkbox" checked>
          <span class="push"></span>Amp LED
        </label>
        <label class="push-toggle" title="Wide stereo on/off">
          <input id="chk-wide" type="checkbox">
          <span class="push"></span>Wide
        </label>
        <button id="btn-connect" class="conn-btn" title="Connection status — click to (re)connect">
          <span id="conn-dot" class="dot offline"></span>
          <span id="conn-label">Connect</span>
        </button>
      </div>
      <div id="amp-root" inert></div>
    </section>

    <div id="blocks-root" class="block-rows" inert></div>
    </div>
  </main>

  <dialog id="console-dialog" class="console">
    <div class="console-head">
      <h2>SysEx console</h2>
      <button type="button" id="btn-close-console">Close</button>
    </div>
    <pre id="log" aria-live="polite"></pre>
    <form id="send-form">
      <input id="hex-input" type="text" spellcheck="false"
             placeholder="Send raw SysEx as hex, e.g. F0 43 7D 20 44 54 41 31 41 6C 6C 50 F7">
      <button type="submit">Send</button>
      <button type="button" id="btn-clear-log">Clear</button>
    </form>
  </dialog>

  <div id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
