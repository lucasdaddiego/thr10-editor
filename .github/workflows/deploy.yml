name: Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
  # Redeploy the current master without an empty commit — needed when the
  # deploy itself has to be re-run (rotated token, a Cloudflare-side failure).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push to the same branch makes the older test run pointless.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Protocol tests
        run: node tests/protocol.test.mjs

      - name: Library tests
        run: node tests/library.test.mjs

      - name: Session tests
        run: node tests/session.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    # Never let an older push finish last and win the deploy.
    concurrency:
      group: deploy
      cancel-in-progress: true
    # The deploy itself (checkout, the sw.js stamp, wrangler) is the reusable
    # lucasdaddiego/.github cloudflare-deploy workflow. @main on purpose: my own
    # public repo, and the actions are SHA-pinned there.
    uses: lucasdaddiego/.github/.github/workflows/cloudflare-deploy.yml@main
    with:
      # No package.json here: nothing to install.
      install: ""
      # Version the service-worker cache for this deploy.
      build: 'sed -i "s/__BUILD__/${GITHUB_SHA:0:8}/" public/sw.js'
      # `wrangler deploy` uploads public/ to thr.daddiego.com.ar (wrangler.jsonc).
      wrangler-command: deploy
      account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
