name: Test & Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

# Never let an older push finish last and win the deploy.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protocol tests
        run: node tests/protocol.test.mjs

      - name: Version the service-worker cache for this deploy
        run: sed -i "s/__BUILD__/${GITHUB_SHA:0:8}/" sw.js

      - name: Deploy to Cloudflare (thr.daddiego.com.ar)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
