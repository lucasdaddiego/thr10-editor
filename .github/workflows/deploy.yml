name: Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
  # Redeploy the current master without an empty commit — needed when the
  # deploy itself has to be re-run (rotated token, a Cloudflare-side failure).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push to the same branch makes the older test run pointless.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Protocol tests
        run: node tests/protocol.test.mjs

      - name: Library tests
        run: node tests/library.test.mjs

      - name: Session tests
        run: node tests/session.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never let an older push finish last and win the deploy.
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version the service-worker cache for this deploy
        run: sed -i "s/__BUILD__/${GITHUB_SHA:0:8}/" public/sw.js

      - name: Deploy to Cloudflare (thr.daddiego.com.ar)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.146.0"
